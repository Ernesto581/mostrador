name: Compilar el APK

# Compila la app de Android en la nube, la firma con tu llave y la publica como
# "release". Asi la app puede actualizarse sola, sin volver a instalarla.
#
# Necesita 4 secretos configurados en el repositorio (Settings -> Secrets -> Actions):
#   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - 'apps/pos/**'
      - 'packages/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

# Para poder crear el release con el APK dentro.
permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar el SDK de Android
        # El runner ya trae el SDK instalado; basta con decirle donde esta.
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          for gestor in "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$gestor" ]; then
              yes | "$gestor" --licenses > /dev/null 2>&1 || true
            fi
          done

      - name: Instalar dependencias
        run: npm install --include=dev

      - name: Compilar la aplicacion web
        env:
          # El numero de la ejecucion sirve de version: siempre sube.
          VITE_VERSION_CODE: ${{ github.run_number }}
        run: npm run build -w @mostrador/pos

      - name: Copiar la aplicacion al proyecto de Android
        working-directory: apps/pos
        run: npx cap sync android

      - name: Compilar y firmar el APK
        working-directory: apps/pos/android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.28 beta"
          KEYSTORE_PATH: ${{ github.workspace }}/firma.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KEYSTORE_PATH"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Dejar el APK con nombre fijo
        # Un nombre fijo da una direccion que nunca cambia, para que la app se actualice.
        run: cp apps/pos/android/app/build/outputs/apk/release/app-release.apk mostrador.apk

      - name: Escribir el numero de version
        run: |
          printf '{"versionCode": %s, "versionName": "%s"}' "${{ github.run_number }}" "1.28 beta" > version.json
          cat version.json

      - name: Publicar la version
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ github.run_number }}
          name: Version ${{ github.run_number }}
          body: |
            **Para instalar o actualizar:** descarga `mostrador.apk` de abajo.

            Se instala encima de la version anterior y **conserva los datos**
            (productos, ventas sin subir y turno abierto).
          files: |
            mostrador.apk
            version.json

      - name: Guardar el APK tambien en la ejecucion
        uses: actions/upload-artifact@v4
        with:
          name: mostrador-apk
          path: mostrador.apk
          if-no-files-found: error

