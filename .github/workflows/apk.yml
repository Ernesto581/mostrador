name: Compilar el APK

# Compila la app de Android en la nube y deja el APK para descargar.
# Asi no hace falta tener el entorno de Android en la computadora.

on:
  push:
    branches: [main]
    paths:
      - 'apps/pos/**'
      - 'packages/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

jobs:
  apk:
    # Version fija: "ubuntu-latest" va a cambiar de version mas adelante.
    runs-on: ubuntu-24.04

    steps:
      - name: Traer el codigo
        uses: actions/checkout@v7

      - name: Preparar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparar el SDK de Android
        # El runner ya trae el SDK instalado; basta con decirle donde esta.
        run: |
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          for gestor in "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$gestor" ]; then
              yes | "$gestor" --licenses > /dev/null 2>&1 || true
            fi
          done

      - name: Instalar dependencias
        run: npm install --include=dev

      - name: Compilar la aplicacion web
        run: npm run build -w @mostrador/pos

      - name: Copiar la aplicacion al proyecto de Android
        working-directory: apps/pos
        run: npx cap sync android

      - name: Compilar el APK
        working-directory: apps/pos/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar el APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: mostrador-apk
          path: apps/pos/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
